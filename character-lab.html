<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f7edce;color:#384531;font-family:system-ui,sans-serif}header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d1c4a3}h1{font:italic 28px Georgia;margin:0}header a{color:#405337}#viewport{height:calc(100vh - 170px);min-height:400px;position:relative}canvas{display:block;width:100%;height:100%}nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:14px;background:#e9dec1}button{background:#fdf6df;border:1px solid #aaae8c;border-radius:4px;padding:9px 14px;cursor:pointer;color:#385138}button.active{background:#385138;color:#fff5d2}label{display:flex;align-items:center;gap:7px;font-size:12px}#stats{position:absolute;left:24px;bottom:18px;font:11px monospace;color:#695f45;line-height:1.8}#caption{position:absolute;top:22px;left:24px;font:italic 24px Georgia}#hint{position:absolute;top:24px;right:24px;font:11px monospace;color:#867956}@media(max-width:600px){header h1{font-size:21px}#hint{display:none}#viewport{height:calc(100svh - 245px)}nav{gap:6px}button{padding:9px;font-size:11px}}

#studio{display:block}#viewport,#reference-panel{min-width:0}#reference-panel{display:none;margin:0;padding:24px 16px;background:#fff1ce;border-right:1px solid #d1c4a3;overflow:hidden}#reference-panel figcaption{font:italic 21px Georgia;margin:0 0 18px}#reference-panel img{width:100%;display:block}body.comparing #studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}body.comparing #reference-panel{display:block}body.comparing #hint{display:none}body.comparing #caption{font-size:19px}.reference-crop{position:relative;aspect-ratio:770/660;overflow:hidden;margin-top:9vh}.reference-crop img{position:absolute;width:149.22%!important;max-width:none;left:-3.9%;top:-17.4%}#reference-panel p{font:12px/1.6 system-ui;color:#786848;margin:20px 0 0}@media(max-width:700px){body.comparing #studio{grid-template-columns:1fr}body.comparing #reference-panel{padding:16px}body.comparing #reference-panel .reference-crop{margin:0 auto;max-width:360px}body.comparing #reference-panel p{display:none}body.comparing #viewport{height:65svh}body.comparing #reference-panel figcaption{font-size:18px}}
body.face-comparing .reference-crop{aspect-ratio:400/510;margin-top:2vh}body.face-comparing .reference-crop img{width:287.25%!important;left:-12.5%;top:-19.6%}select{padding:8px;background:#fdf6df;color:#385138;border:1px solid #aaae8c;border-radius:4px}</style></head><body><header><h1>Dook! Character & Rig Studio</h1><a href="/">Back to game ↗</a></header><main id="studio"><figure id="reference-panel"><figcaption>Approved character reference</figcaption><div class="reference-crop"><img src="/art/character-reference.png" alt="Approved ferret: cream face, sable mask, long tan body, orange bandana"></div><p>Original artwork. Compare the face, proportions, cloth and pixel pattern against the frozen 3D model.</p></figure><div id="viewport"><div id="caption">The local chaos noodle</div><div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div><div id="stats"></div></div></main><nav id="controls"><button id="compare">Compare reference</button><button id="face">Face close-up</button><label>Expression <select id="expression"><option value="neutral">Relaxed</option><option value="grin" selected>Little grin</option><option value="happy">Big smile</option><option value="dook">Dook!</option></select></label><button data-mode="idle" class="active">Idle</button><button data-mode="scamper">Scamper</button><button data-mode="bound">Bound</button><button data-mode="jump">Jump</button><button data-mode="barrel">Big jump + 360°</button><button data-mode="slide">Squeeze</button><button id="pause">Pause</button><label><input type="checkbox" id="skeleton">Skeleton</label><label><input type="checkbox" id="wireframe">Wireframe</label><label>Speed <input type="range" id="speed" min="0" max="1.5" step=".05" value="1"></label><button id="side">Side view</button><button id="front">3/4 view</button><button id="friend">Goose Michael</button></nav><script type="module" src="/src/character-lab.js"></script></body></html>
